name: SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
  - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  sbom:
    runs-on: docker            # use a label your runner actually has
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq jq curl ca-certificates python3 python3-venv python3-pip
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt

          syft dir:/tmp/venv \
            --source-name "${{ github.event.repository.name }}" \
            --source-version "${{ github.ref_name }}" \
            -o cyclonedx-json=bom.json

          echo "Components: $(jq '.components | length' bom.json)"

          # Remove license URLs that aren't valid IRIs
          jq 'walk(
                if type == "object" and (.license? | type) == "object"
                   and ((.license.url? // "") | test("^[A-Za-z][A-Za-z0-9+.-]*:[^\\s<>\"{}|\\\\^`]+$") | not)
                then .license |= del(.url)
                else . end
              )' bom.json > bom.clean.json
          mv bom.clean.json bom.json

      - name: Upload to Dependency-Track
        env:
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          DT_URL: ${{ vars.DT_URL }}
          PROJECT: "Forgejo: ${{ forgejo.repository }}"
          VERSION: ${{ forgejo.ref_name }}
        run: |
          curl -sS --fail-with-body -X POST "${DT_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -F "projectName=${PROJECT}" \
            -F "projectVersion=${VERSION}" \
            -F "autoCreate=true" \
            -F "bom=@bom.json"

      - name: Keep SBOM as artifact
        uses: actions/upload-artifact@v7   # Forgejo supports v3, not v4
        with:
          name: sbom
          path: bom.json
